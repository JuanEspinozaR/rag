spring:
  application:
    name: rag-platform-backend

  # ============================================================
  # Database
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragplatform}
    username: ${SPRING_DATASOURCE_USERNAME:raguser}
    password: ${SPRING_DATASOURCE_PASSWORD:ragpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: RagPlatformPool

  # ============================================================
  # JPA
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ============================================================
  # Flyway
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ============================================================
  # Spring AI - OpenAI
  # ============================================================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.7
          max-tokens: 2048
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    # PgVector Store
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${PGVECTOR_DIMENSION:1536}
        initialize-schema: false

  # ============================================================
  # WebFlux / Codec
  # ============================================================
  codec:
    max-in-memory-size: 10MB

  # ============================================================
  # Jackson
  # ============================================================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ============================================================
# Server
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ============================================================
# Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

# ============================================================
# Langfuse
# ============================================================
langfuse:
  enabled: true
  public-key: ${LANGFUSE_PUBLIC_KEY:pk-lf-placeholder}
  secret-key: ${LANGFUSE_SECRET_KEY:sk-lf-placeholder}
  host: ${LANGFUSE_HOST:http://localhost:3001}

# ============================================================
# Application
# ============================================================
app:
  rag:
    top-k: 5
    similarity-threshold: 0.3
    max-context-length: 8000
  chunking:
    chunk-size: 512
    chunk-overlap: 64

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ragplatform: ${LOG_LEVEL:INFO}
    org.springframework.ai: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json

---
# ============================================================
# Local Profile (development without Docker)
# ============================================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/ragplatform
    username: raguser
    password: ragpassword
  jpa:
    show-sql: true

logging:
  level:
    com.ragplatform: DEBUG

---
# ============================================================
# Docker Profile
# ============================================================
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
